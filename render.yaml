services:
  - type: web
    name: chatboat-ppg
    env: python
    plan: free
    buildCommand: pip install -r requirements-runtime.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OLLAMA_HOST
        sync: false
      - key: LLM_MODEL
        value: qwen2.5:7b
      - key: EMBED_MODEL
        value: bge-m3
      - key: AUTO_INGEST
        value: "true"
      - key: CHROMA_DIR
        value: db/chroma
