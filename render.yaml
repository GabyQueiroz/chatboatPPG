services:
  - type: web
    name: chatboat-ppg
    env: python
    plan: free
    buildCommand: pip install -r requirements-runtime.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_OLLAMA_HOST
        sync: false
      - key: LLM_OLLAMA_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: EMBED_OLLAMA_HOST
        value: http://127.0.0.1:11434
      - key: EMBED_MODEL
        value: bge-m3
      - key: AUTO_INGEST
        value: "true"
      - key: CHROMA_DIR
        value: db/chroma
      - key: INGEST_BATCH_SIZE
        value: "8"
      - key: ENABLE_ADMIN_ENDPOINTS
        value: "false"
